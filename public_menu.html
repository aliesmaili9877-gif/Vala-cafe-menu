<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b32"><meta name="description" content="منوی آنلاین کافه‌رستوران والا">
<title>منوی کافه‌رستوران والا</title>
<style>
:root{--green:#173b32;--green2:#285747;--cream:#f7f5ee;--gold:#c7a66a;--ink:#26352e;--muted:#7b867e;--line:#e8e6dc}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.7}
.menu-shell{max-width:760px;margin:auto;padding:0 17px 42px}.hero{margin:0 -17px 25px;padding:35px 22px 31px;text-align:center;color:#fff;background:radial-gradient(circle at 80% 0%,#456b54 0,transparent 37%),linear-gradient(145deg,#102c25,#234b3b);border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:190px;height:190px;border:1px solid #ffffff20;border-radius:50%;left:-60px;bottom:-115px}.brand-mark{width:64px;height:64px;margin:0 auto 12px;border:1px solid #d9c18c;border-radius:50%;display:grid;place-items:center;color:#e1c98e;font:italic 34px Georgia,serif}.hero h1{font-size:25px;margin:0 0 2px;letter-spacing:-.5px}.english{font:11px Georgia,serif;letter-spacing:3px;color:#d8c18f}.hero p{font-size:12px;color:#e0e9e1;margin:16px 0 0}.intro{text-align:center;margin:24px 0 20px}.intro span{color:var(--gold);font-size:11px;letter-spacing:2px}.intro h2{margin:1px 0 0;font-size:23px;color:var(--green)}.intro p{font-size:12px;color:var(--muted);margin:3px 0}
.category{margin:18px 0 24px}.category-title{display:flex;align-items:center;gap:11px;margin:0 0 10px;color:var(--green);font-size:17px}.category-title:after{content:"";height:1px;background:var(--line);flex:1}.item-list{background:#fff;border:1px solid var(--line);border-radius:17px;padding:4px 15px;box-shadow:0 5px 18px #1c35220a}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 1px;border-bottom:1px dashed #e9e7df}.item:last-child{border-bottom:0}.item-name{font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}.item-price{white-space:nowrap;color:var(--green2);font-size:13px;font-weight:700}.item-price small{font-size:10px;color:var(--muted);font-weight:400}.empty{background:#fff;border:1px solid var(--line);border-radius:16px;text-align:center;padding:25px 15px;color:var(--muted);font-size:13px}.status{text-align:center;color:var(--muted);font-size:10px;margin:16px 0 0}.footer{text-align:center;border-top:1px solid var(--line);margin-top:28px;padding:20px 0 0;color:var(--muted);font-size:12px}.footer strong{display:block;color:var(--green);font-size:14px;margin-bottom:4px}.leaf{color:var(--gold)}
@media(min-width:600px){.hero{margin-top:18px;border-radius:26px}.menu-shell{padding-top:1px}.item-list{padding:5px 22px}.item{padding:15px 2px}}
</style></head>
<body><main class="menu-shell">
<header class="hero"><div class="brand-mark">V</div><h1>کافه‌رستوران والا</h1><div class="english">VALA · CAFE & RESTAURANT</div><p>طعم خوبِ لحظه‌های به‌یادماندنی</p></header>
<section class="intro"><span>OUR MENU</span><h2>منوی والا</h2><p>با عشق انتخاب شده برای لحظه‌های شما</p></section>
<div id="publicMenuItems" aria-live="polite"><div class="empty">در حال دریافت منوی والا…</div></div>
<div class="status" id="menuStatus">قیمت‌ها به‌صورت خودکار به‌روز می‌شوند.</div>
<footer class="footer"><strong>کافه‌رستوران والا</strong>از انتخاب شما سپاسگزاریم <span class="leaf">✦</span></footer>
</main>
<script>
const fmt=n=>Number(n||0).toLocaleString('fa-IR');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await fetch('/api/public-menu',{cache:'no-store'});if(!r.ok)throw Error('network');const items=await r.json();const root=document.getElementById('publicMenuItems');if(!items.length){root.innerHTML='<div class="empty">در حال حاضر محصولی در منو ثبت نشده است.</div>';return;}const cats=[...new Set(items.map(x=>x.category))];root.innerHTML=cats.map(cat=>`<section class="category"><h3 class="category-title">${safe(cat)}</h3><div class="item-list">${items.filter(x=>x.category===cat).map(x=>`<article class="item"><span class="item-name">${safe(x.name)}</span><span class="item-price">${fmt(x.price)} <small>تومان</small></span></article>`).join('')}</div></section>`).join('');document.getElementById('menuStatus').textContent='آخرین بررسی به‌روزرسانی: '+new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});}
load().catch(()=>{document.getElementById('publicMenuItems').innerHTML='<div class="empty">ارتباط با منو برقرار نشد. لطفاً چند لحظه دیگر دوباره تلاش کنید.</div>'});setInterval(()=>load().catch(()=>{}),30000);
</script></body></html>
